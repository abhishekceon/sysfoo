name: hello-world-cf
on: push
jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
      - name: my-step
        run: echo "Hello World!"
        
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        
      - name: SAST
        run: echo "SAST"
        
      - name: Docker Image
        run: docker build -t abhishekceon/cf-sysfoo .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'docker.io/abhishekceon/cf-sysfoo:latest'
          format: 'table'
        
      - name: Dockerhub
        run: echo "Dockerhub"
        
      - name: DAST - Zap
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://ginandjuice.shop/'
